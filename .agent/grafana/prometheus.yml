global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'navigator-claude-code'

scrape_configs:
  - job_name: 'claude-code'
    static_configs:
      - targets: ['host.docker.internal:9464']
        labels:
          app: 'claude-code'
          environment: 'local'

    # Scrape interval for Claude Code metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # Pilot daemon metrics (the daemon runs on AWS; this target is reachable only through
  # the founder's tunnel). Other setups see one failed scrape here, which is harmless.
  - job_name: 'pilot'
    static_configs:
      - targets: ['host.docker.internal:9091']
        labels:
          app: 'pilot'
          environment: 'aws'
