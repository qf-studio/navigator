services:
  otel-collector:
    # Every Claude Code session pushes OTLP metrics here (OTEL_METRICS_EXPORTER=otlp,
    # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318). One endpoint for any number of
    # processes; the direct prometheus exporter can only be bound by one (TASK-101).
    image: otel/opentelemetry-collector-contrib:0.144.0
    container_name: navigator-otel-collector
    command: ["--config=/etc/otelcol/config.yml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"   # scrape endpoint, exposed for `curl localhost:8889/metrics`
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol/config.yml:ro
    restart: unless-stopped
    networks:
      - navigator-monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: navigator-prometheus
    ports:
      - "9092:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
    # Claude Code's exporter listens on the host (:9464); not every Docker runtime resolves
    # host.docker.internal on a custom network without this mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - navigator-monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: navigator-grafana
    ports:
      - "3333:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./navigator-dashboard.json:/etc/grafana/provisioning/dashboards/navigator-dashboard.json
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3333
      - GF_INSTALL_PLUGINS=
    restart: unless-stopped
    networks:
      - navigator-monitoring
    depends_on:
      - prometheus

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  navigator-monitoring:
    driver: bridge
