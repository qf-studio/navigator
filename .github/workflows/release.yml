name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: make test

      - name: Validate plugin integrity (skills exist, committed, versions consistent)
        run: python3 skills/nav-release/functions/release_validator.py --check-all

      - name: Verify every manifest hook path resolves to a file
        # Guards the v6.15.6 regression class: a deleted hook left registered in plugin.json.
        run: python3 skills/nav-release/functions/release_validator.py --verify-hook-paths

      - name: Verify all version files match the pushed tag
        run: python3 skills/nav-release/functions/release_validator.py --check-version "${{ steps.version.outputs.version }}"

      - name: Verify tag contains all skills
        run: python3 skills/nav-release/functions/release_validator.py --verify-tag "${GITHUB_REF#refs/tags/}"

      - name: Verify the v8 mod (module declared, owned ops on both sides, generated data fresh)
        run: python3 skills/nav-release/functions/release_validator.py --verify-mod

  validate-mod:
    name: Validate mod (Claude Code 2.1.287)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code (pinned minimum for mods)
        run: npm install -g @anthropic-ai/claude-code@2.1.287

      - name: Validate plugin manifest and hooks module
        run: make mod-validate

      - name: Run mod kit tests
        run: make mod-test

  release:
    name: Create GitHub Release
    needs: [validate, validate-mod]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Locate release notes
        id: check_notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Canonical location (Navigator convention)
          PRIMARY="releases/RELEASE-NOTES-v${VERSION}.md"
          # Legacy fallback — pre-v3.x notes lived at repo root
          FALLBACK="RELEASE-NOTES-v${VERSION}.md"

          if [ -f "$PRIMARY" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "path=$PRIMARY" >> $GITHUB_OUTPUT
            echo "Found release notes at $PRIMARY"
          elif [ -f "$FALLBACK" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "path=$FALLBACK" >> $GITHUB_OUTPUT
            echo "Found release notes at $FALLBACK (legacy path)"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "path=" >> $GITHUB_OUTPUT
            echo "No release notes file found for v${VERSION}; workflow will fall back to generic body."
          fi

      - name: Determine if pre-release
        id: prerelease
        run: |
          # Pre-release is driven solely by the tag suffix (alpha/beta/rc).
          # The previous marketplace.json `grep -q "Experimental"` branch was
          # dead: marketplace.json only ever contains lowercase "experimental"
          # inside the historical breaking_changes changelog array — never a
          # status field — so the case-sensitive grep matched zero on every
          # normal release, and would false-fire *every* release if a changelog
          # entry were ever capitalized. Tag suffix is the single source of truth.
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"rc"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES_PATH: ${{ steps.check_notes.outputs.path }}
          NOTES_EXISTS: ${{ steps.check_notes.outputs.exists }}
          IS_PRERELEASE: ${{ steps.prerelease.outputs.is_prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating in place."
            EDIT_ARGS=(
              "$TAG"
              --title "Navigator $TAG"
              --prerelease="$IS_PRERELEASE"
            )
            if [ "$NOTES_EXISTS" = "true" ]; then
              EDIT_ARGS+=(--notes-file "$NOTES_PATH")
            fi
            gh release edit "${EDIT_ARGS[@]}"

            if [ "$NOTES_EXISTS" = "true" ]; then
              gh release upload "$TAG" "$NOTES_PATH" --clobber
            fi
          else
            ARGS=(
              "$TAG"
              --title "Navigator $TAG"
            )

            if [ "$NOTES_EXISTS" = "true" ]; then
              ARGS+=(--notes-file "$NOTES_PATH")
              ARGS+=("$NOTES_PATH")
            else
              ARGS+=(--notes "Release $TAG"$'\n\n'"See commit history for changes.")
            fi

            if [ "$IS_PRERELEASE" = "true" ]; then
              ARGS+=(--prerelease)
            fi

            gh release create "${ARGS[@]}"
          fi

      - name: Verify marketplace compatibility
        run: |
          echo "✅ Release ${{ steps.version.outputs.tag }} published"
          echo ""
          echo "📦 Marketplace will auto-update from:"
          echo "   https://github.com/qf-studio/navigator/releases/tag/${{ steps.version.outputs.tag }}"
          echo ""
          echo "Users can update with:"
          echo "   /plugin update navigator"
          echo ""
          if [ "${{ steps.prerelease.outputs.is_prerelease }}" == "true" ]; then
            echo "⚠️  This is a PRE-RELEASE"
            echo "   Latest stable API endpoint will not show this version"
            echo "   Users need to explicitly opt-in to pre-releases"
          fi
