name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the macOS system Python and the Pilot founder box; the hook runtime
        # and every skill script must import there. 3.12 is the reference interpreter.
        python-version: ['3.9', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        # `make test` runs per-directory unittest discovery across all genuine
        # suites (see Makefile TEST_DIRS) — same command used locally.
        run: make test

      - name: Generated mod data matches the Python runtime
        if: matrix.python-version == '3.12'
        run: make mod-gen-check

  mod-tests:
    name: Mod kit tests (Claude Code 2.1.287)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code (pinned minimum for mods)
        # validate + test run offline with no credentials (verified locally on 2.1.287).
        run: npm install -g @anthropic-ai/claude-code@2.1.287

      - name: Validate plugin manifest and hooks module
        # Non-strict: the baseline carries one known, benign warning (CLAUDE.md at the
        # plugin root). Errors still fail. TASK-107 cleared the gating-hook and manifest lines.
        run: make mod-validate

      - name: Run mod kit tests
        run: make mod-test
